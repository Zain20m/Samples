name: Apply sample credits
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-sample-credits.yml"
permissions:
  contents: write
jobs:
  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add credits to Lua samples
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header = "-- Samples by etl_c on discord [Cdaily]"
          changed = 0
          for path in Path(".").rglob("*.lua"):
              if ".git" in path.parts:
                  continue
              try:
                  data = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if data.startswith(header):
                  continue
              path.write_text(header + "\n" + data, encoding="utf-8", newline="")
              changed += 1
          print(f"Updated {changed} Lua files")
          PY
      - name: Commit credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.lua'
          if git diff --cached --quiet; then
            echo "No files needed updates"
          else
            git commit -m "Add etl_c sample credits [skip ci]"
            git push origin main
          fi
